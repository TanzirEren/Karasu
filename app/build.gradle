plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tenix.karasu'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tenix.karasu'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled false
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}
